services:
  frontend:
    container_name: EmegeClient
    build:
      context: ./client
      dockerfile: Dockerfile
    image: emege_client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules

  backend:
    container_name: EmegeBackend
    build:
      context: ./server
      dockerfile: Dockerfile
    image: emege_server
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://*:5000
      - DOTNET_URLS=http://*:5000
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    secrets:
      - db_password

  # https://hub.docker.com/_/postgres/#-via-docker-compose
  postgres:
    container_name: EmegePostgres
    image: postgres:16.9-bullseye
    ports: ["5432:5432"]
    restart: always
    # shm_size: 128mb
    volumes:
      - ./postgres/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    secrets:
      - db_password

secrets:
  db_password:
    file: secrets/db_password.txt

networks:
  emege_network:
    driver: bridge
